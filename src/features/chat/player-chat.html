              <aside class="player-chat" id="playerChat" aria-label="Chat dentro del video">
                <div class="player-chat-header">
                  <button
                    class="presence-pill player-chat-presence"
                    id="overlayPresencePill"
                    type="button"
                    aria-label="Usuarios conectados"
                    data-tooltip="Conectados: vos"
                  >
                    <span class="presence-icon-wrap" aria-hidden="true">
                      <span class="presence-users-icon" data-lucide="user-round"></span>
                      <span class="status-dot presence-dot"></span>
                    </span>
                    <span class="presence-self-label" id="overlayPresenceSelfLabel" hidden></span>
                    <span id="overlayParticipantCount">1</span>
                  </button>
                  <div class="player-chat-header-actions">
                    <div
                      class="chat-style-toggle"
                      id="chatStyleToggle"
                      role="group"
                      aria-label="Estilo del chat dentro del video"
                    >
                      <button
                        type="button"
                        data-chat-style="float"
                        class="active"
                        aria-label="Panel translucido"
                        data-tooltip="Panel translucido"
                      >
                        <span data-lucide="square"></span>
                      </button>
                      <button
                        type="button"
                        data-chat-style="panel"
                        aria-label="Panel opaco"
                        data-tooltip="Panel opaco"
                      >
                        <span data-lucide="square"></span>
                      </button>
                    </div>
                    <button
                      class="bare-icon-button"
                      id="closeInsideChatButton"
                      type="button"
                      aria-label="Ocultar chat"
                      title="Ocultar chat"
                      data-tooltip="Ocultar chat"
                    >
                      <span data-lucide="x"></span>
                    </button>
                    <button
                      class="help-button chat-auto-switch-help"
                      type="button"
                      aria-label="Ayuda sobre la autoexpansión del chat"
                      data-tooltip="Al recibir mensajes nuevos, el chat se abre; al enviar una respuesta, se oculta"
                    >
                      <span data-lucide="circle-help"></span>
                    </button>
                    <button
                      class="chat-auto-switch"
                      id="insideChatAutoExpandSwitch"
                      type="button"
                      role="switch"
                      aria-checked="false"
                      aria-label="Autoexpandir chat interno"
                    >
                      <span class="chat-auto-switch-track" aria-hidden="true">
                        <span class="chat-auto-switch-thumb"></span>
                      </span>
                    </button>
                  </div>
                </div>
                <div class="messages-wrap">
                  <div class="overlay-messages" id="overlayMessages" aria-live="polite"></div>
                  <div class="chat-scrollbar" aria-hidden="true">
                    <div class="chat-scrollbar-thumb"></div>
                  </div>
                  <button class="scroll-bottom-btn" id="overlayScrollBottomBtn" hidden aria-label="Ir al último mensaje" data-tooltip="Ir al último mensaje">
                    <span data-lucide="chevrons-down"></span>
                    <span class="scroll-bottom-badge" id="overlayScrollBadge">0</span>
                  </button>
                </div>
                <form class="message-form overlay-message-form" id="overlayMessageForm">
                <div class="reply-preview" id="overlayReplyPreview" hidden></div>
                <div class="image-preview-container" id="overlayImagePreview" hidden></div>
                <div class="input-wrapper">
                  <div class="textarea-shell">
                    <textarea
                      id="overlayMessageInput"
                      autocomplete="off"
                      autocapitalize="off"
                      spellcheck="false"
                      data-bwignore="true"
                      data-lpignore="true"
                      placeholder="Mensaje"
                      rows="1"
                    ></textarea>
                    <div class="composer-scrollbar" aria-hidden="true">
                      <div class="composer-scrollbar-thumb"></div>
                    </div>
                  </div>
                    <button
                      class="icon-button ghost emoji-trigger"
                      id="overlayEmojiButton"
                      type="button"
                      aria-label="Abrir emojis"
                      title="Emojis"
                      data-tooltip="Agregar emoji"
                    >
                      <span data-lucide="smile-plus"></span>
                    </button>
                    <button class="icon-button send" id="overlayMessageSend" type="submit" aria-label="Enviar mensaje" data-tooltip="Enviar mensaje (Enter)">
                      <svg class="composer-progress-ring" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
                        <circle class="composer-progress-track" cx="22" cy="22" r="18.5" pathLength="100"></circle>
                        <circle class="composer-progress-value" cx="22" cy="22" r="18.5" pathLength="100"></circle>
                      </svg>
                      <span data-lucide="send"></span>
                    </button>
                  </div>
                  <div class="char-counter" id="overlayCharCounter">0 / 300</div>
                </form>
              </aside>
