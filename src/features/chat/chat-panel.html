          <aside class="chat-area" aria-label="Chat de la sala">
            <div class="chat-tools">
              <span class="chat-area__collapse-header-slot" aria-hidden="true"></span>
              <div class="chat-tools__leading">
                <button
                  class="presence-pill"
                  id="presencePill"
                  type="button"
                  aria-label="Usuarios conectados"
                  data-tooltip="Conectados: vos"
                >
                  <span class="presence-pill__icon-wrap" aria-hidden="true">
                    <span class="presence-pill__users-icon" data-lucide="user-round"></span>
                    <span class="u-status-dot   presence-pill__dot"></span>
                  </span>
                  <span class="presence-pill__self-label" id="presenceSelfLabel" hidden></span>
                  <span id="participantCount">1</span>
                </button>
                <div class="chat-name-editor__field">
                  <div class="chat-name-editor" id="chatNameField" data-editing="false">
                    <div class="chat-name-editor__display-row">
                      <span
                        class="chat-name-editor__display"
                        id="nameDisplay"
                        data-tooltip="Nombre visible para los participantes de la sala"
                      >Invitado</span>
                      <button
                        class="chat-name-editor__edit-button"
                        id="editNameButton"
                        type="button"
                        aria-label="Editar nombre"
                        title="Editar nombre"
                        data-tooltip="Editar nombre"
                      >
                        <span data-lucide="pencil"></span>
                      </button>
                    </div>
                    <div class="chat-name-editor__edit-row">
                      <input
                        id="nameInput"
                        type="search"
                        autocomplete="off"
                        enterkeyhint="done"
                        autocapitalize="off"
                        spellcheck="false"
                        data-bwignore="true"
                        data-lpignore="true"
                        maxlength="20"
                        aria-label="Nombre visible para los participantes de la sala"
                        data-tooltip="Nombre visible para los participantes de la sala"
                      />
                      <button
                        class="chat-name-editor__confirm-button"
                        id="confirmNameButton"
                        type="button"
                        aria-label="Aceptar nombre"
                        title="Aceptar nombre"
                        data-tooltip="Aceptar nombre (Enter)"
                      >
                        <span data-lucide="check"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="chat-area__collapse-hover-zone   chat-area__collapse-hover-zone--collapse"
                data-chat-control="collapse"
              >
                <button
                  class="chat-area__collapse-handle"
                  id="collapseChatButton"
                  type="button"
                  aria-label="Contraer chat"
                  title="Contraer chat"
                  tabindex="-1"
                >
                  <span class="chat-area__collapse-icon-anchor">
                    <span data-lucide="arrow-right"></span>
                  </span>
                </button>
              </div>
              <div class="chat-tools__actions">
                <button
                  class="help-button   help-button--chat-auto-switch"
                  type="button"
                  aria-label="Ayuda sobre la autoexpansión del chat"
                  data-tooltip="Al recibir mensajes nuevos, el chat se abre; al enviar una respuesta, se oculta"
                >
                  <span data-lucide="circle-help"></span>
                </button>
                <button
                  class="chat-auto-switch"
                  id="externalChatAutoExpandSwitch"
                  type="button"
                  role="switch"
                  aria-checked="false"
                  aria-label="Autoexpandir chat externo"
                >
                  <span class="chat-auto-switch__track" aria-hidden="true">
                    <span class="chat-auto-switch__thumb"></span>
                  </span>
                </button>
                <button
                  class="icon-button   icon-button--dock"
                  id="dockChatButton"
                  type="button"
                  aria-label="Mover chat"
                  data-tooltip="Mover chat abajo"
                >
                  <span data-lucide="panel-right"></span>
                </button>
              </div>
            </div>

            <div class="chat-message-list-shell">
              <div class="chat-message-list" id="messages" aria-live="polite"></div>
              <div class="chat-scrollbar" aria-hidden="true">
                <div class="chat-scrollbar__thumb"></div>
              </div>
              <button class="scroll-bottom-btn" id="mainScrollBottomBtn" type="button" hidden aria-label="Ir al último mensaje" data-tooltip="Ir al último mensaje">
                <span data-lucide="chevrons-down"></span>
                <span class="scroll-bottom-btn__badge" id="mainScrollBadge">0</span>
              </button>
            </div>

            <form class="message-form" id="messageForm">
              <div class="reply-preview" id="replyPreview" hidden></div>
              <div class="image-preview-container" id="imagePreview" hidden></div>
              <div class="message-form__input-wrapper">
                <div class="message-form__textarea-shell">
                  <textarea
                    id="messageInput"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    data-bwignore="true"
                    data-lpignore="true"
                      placeholder="Mensaje"
                    rows="1"
                  ></textarea>
                  <div class="composer-scrollbar" aria-hidden="true">
                    <div class="composer-scrollbar__thumb"></div>
                  </div>
                </div>
                <button
                  class="icon-button   icon-button--ghost   icon-button--emoji-trigger"
                  id="messageEmojiButton"
                  type="button"
                  aria-label="Abrir emojis"
                  title="Emojis"
                  data-tooltip="Agregar emoji"
                >
                  <span data-lucide="smile-plus"></span>
                </button>
                <button class="icon-button   icon-button--send" id="mainMessageSend" type="submit" aria-label="Enviar mensaje" data-tooltip="Enviar mensaje (Enter)">
                  <svg class="icon-button__progress-ring" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
                    <circle class="icon-button__progress-track" cx="22" cy="22" r="18.5" pathLength="100"></circle>
                    <circle class="icon-button__progress-value" cx="22" cy="22" r="18.5" pathLength="100"></circle>
                  </svg>
                  <span data-lucide="send"></span>
                </button>
              </div>
              <div class="char-counter" id="mainCharCounter">0 / 300</div>
            </form>
          </aside>
          <div
            class="chat-area__collapse-hover-zone   chat-area__collapse-hover-zone--expand"
            data-chat-control="expand"
          >
            <button
              class="chat-area__collapse-handle"
              id="expandChatButton"
              type="button"
              aria-label="Expandir chat"
              title="Expandir chat"
              tabindex="-1"
            >
              <span class="chat-area__collapse-icon-anchor">
                <span data-lucide="arrow-right"></span>
              </span>
            </button>
          </div>
