      <header class="topbar">
        <div class="topbar-brand">
          <h1>Cine Juntos</h1>
        </div>
        <div class="topbar-actions">
          <div class="room-chip" id="roomChip">
            <div class="room-chip-heading">
              <span class="room-chip-label-row">
                <span class="room-chip-label">Sala de cine</span>
                <button
                  class="help-button"
                  type="button"
                  aria-label="Ayuda sobre la sala"
                  data-tooltip="Este es el código de la sala en la que estás, compartilo para invitar a más personas a unirse"
                >
                  <span data-lucide="circle-help"></span>
                </button>
              </span>
              <h1 class="room-chip-title">
                <span class="app-status room-chip-status-inline" id="connectionStatus" role="button" tabindex="0" data-state="starting" data-tooltip="Conectando con la sala" aria-label="Estado de la aplicación: Iniciando. Conectando con la sala">
                  <span class="status-dot app-status-dot" aria-hidden="true"></span>
                </span>
                <span class="room-chip-title-prefix">SALA</span>
                <span class="room-chip-title-actions">
                  <button
                    class="room-chip-code room-chip-copy room-chip-code-button"
                    id="copyInviteButton"
                    type="button"
                    aria-label="Copiar enlace de invitación"
                    data-tooltip="Click para copiar código/invitación"
                  >
                    <span class="room-chip-copy-main">
                      <span class="room-chip-copy-motion">
                        <span class="room-chip-code-text" id="roomBadge">Sin sala</span>
                        <span class="room-chip-copy-confirm" aria-hidden="true">
                          <span data-lucide="check"></span>
                        </span>
                      </span>
                    </span>
                  </button>
                </span>
              </h1>
            </div>
            <div class="room-chip-actions">
              <button
                class="room-chip-back-button"
                id="backToLobbyButton"
                type="button"
                aria-label="Volver a la entrada"
                data-tooltip="Volver a la entrada"
              >
                <span data-lucide="arrow-left" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </header>
